  reason: partner-login
  detail: >-
    Graybar runs its own Azure API Management developer portal at apiportal-snd.graybar.com,
    and search engines have indexed descriptions of real APIs on it (material availability
    by location, orders and quotes for a customer, frequently-purchased materials), but the
    portal's anonymous API catalog returns an empty list and /developer/identity returns 401
    — every API definition, reference and specification sits behind a developer-account
    sign-in, so nothing is readable without credentials.
