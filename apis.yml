description: >-
  Graybar Electric Company is an employee-owned Fortune 500 distributor of electrical,
  communications, and data networking products and a provider of related supply chain
  management and logistics services. Graybar serves contractors, industrial plants,
  utilities, institutions and commercial customers across North America through a network
  of distribution centers and branches, and supports customer e-procurement through EDI,
  XML and PunchOut system-to-system integration. Graybar operates an Azure API Management
  developer portal at apiportal-snd.graybar.com, but publishes no API to anonymous
  visitors: the portal's API catalog is empty without a sign-in.
