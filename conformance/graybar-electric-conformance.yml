method: searched
source: >-
  graybar.com, the two Graybar-published integration fliers linked from graybar.com, and
  the apiportal-snd.graybar.com Azure API Management developer portal, probed 2026-08-28.
note: >-
  Graybar publishes no machine-readable contract, so no cross-cutting API standard can be
  asserted or refuted from a spec. Every entry below is recorded against the provider's own
  published material only. Graybar's market (industrial/electrical distribution B2B
  procurement) does have real domain standards — X12/EDIFACT EDI and cXML/OCI PunchOut —
  and Graybar markets both, but neither is DECLARED in a contract we can read, so
  domain_standard_conformance is recorded as unverified rather than conformant. This is a
  reward-only dimension: an unverified entry is not a penalty and nothing is invented to
  fill it.
