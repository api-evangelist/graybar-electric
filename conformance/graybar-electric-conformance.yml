domain_standards:
  - id: x12-edi
    name: ASC X12 / EDI business documents
    conforms: unverified
    declared_in: provider marketing PDF, not a contract
    evidence:
      - url: https://res.cloudinary.com/dngevqko7/image/upload/v1770693462/graybar-electronic-system-integration-flier.pdf
        status: 200
        finding: >-
          "Graybar utilizes EDI, XML and other proprietary data formats to exchange business
          information and documents with our customers." The flier names the supported
          business documents by NAME, not by X12 transaction-set number: planning schedule
          with release capability, request for quotation, customer purchase order, purchase
          order acknowledgement, advanced shipping notice, customer change order, Graybar
          invoice, electronic funds transfer, system data acknowledgement, rejection notice,
          response to quote. No transaction-set numbers are stated by Graybar and none are
          inferred here.
      - url: https://b2b.graybar.com/
        status: '<no response>'
        finding: >-
          b2b.graybar.com CNAMEs to as2.graybar.com (20.97.54.9), an AS2 EDI transport host.
          Connection refused on 443 and 80 — reachable only by provisioned trading partners,
          which is normal and correct for AS2 but means the surface cannot be verified.
  - id: punchout
    name: PunchOut catalog (cXML / OCI class of standard)
    conforms: unverified
    declared_in: provider marketing PDF, not a contract
    evidence:
      - url: https://res.cloudinary.com/dngevqko7/image/upload/v1770689522/graybar-punchout-flier.pdf
        status: 200
        finding: >-
          "Use your procurement system to connect to Graybar.com and access the products you
          need to add to your requisition list... Graybar is able to support multiple levels
          of PunchOut." Graybar does not name cXML or OCI anywhere in the flier, and no
          PunchOut setup URL, session request schema or transport endpoint is published, so
          the specific protocol is NOT asserted here.
